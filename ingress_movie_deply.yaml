---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: movies-deply                      # Name of the Deployment resource
  namespace: ingress-1                 	  # Target namespace for the Deployment
spec:
  replicas: 2                             # Number of Pod replicas to maintain
  selector:
    matchLabels:
      app: movies                         # Matches labels defined in the Pod template
  template:
    metadata:
      labels:
        app: movies                       # Label assigned to Pods managed by this Deployment
    spec:
      containers:
        - name: movies-1                  # Name of the container inside the Pod
          image: umeshchandra2001/ticket_booking:movies-v1  # Container image to pull and run
          ports:
            - containerPort: 80          # Application port exposed by the container
          env:                           # Environment variables injected into the container
            - name: TITLE                # Variable key
              value: "movies"            # Variable value

---
apiVersion: v1
kind: Service
metadata:
  name: movies                           # Name of the Service resource
  namespace: ingress-1                   # Must match the Deployment namespace to route traffic
spec:
  type: NodePort                         # Exposes the service on each Node's IP at a static port
  ports:
    - port: 80                           # Port exposed internally inside the cluster
      targetPort: 80                     # Destination port on the backend Pods (defaults to port if omitted)
  selector:
    app: movies                          # Directs incoming traffic to Pods with the label 'app: movies'
