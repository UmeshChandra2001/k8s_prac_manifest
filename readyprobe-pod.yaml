---
apiVersion: v1
kind: Pod
metadata:
  name: readyprobe-pod              # Unique name of the Pod
spec:
  containers:
    - name: cont1                   # Container name
      image: nginx                  # Base container image
      ports:
        - containerPort: 80         # Target port exposed by container
      args:
        - /bin/sh                   # Shell to execute the init process
        - -c                        # Pass command string to shell
        - touch /tmp/ready.txt; sleep 1000; # Create file and stay alive
      readinessProbe:
        exec:
          command:
            - cat                   # Check command (returns 0 on success)
            - /tmp/ready.txt        # Path checked for readiness status
        initialDelaySeconds: 5      # Wait 5 seconds after start before the first check
        periodSeconds: 10           # Probe every 10 seconds afterwards
        timeoutSeconds: 30          # Probe times out if unresponsive for 30 seconds
        failureThreshold: 2         # Mark NotReady after 2 consecutive failures
        successThreshold: 1         # Mark Ready after 1 successful check
