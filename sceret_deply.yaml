---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      env: prd
  template:
    metadata:
      labels:
        env: prd
    spec:
      imagePullSecrets:
        - name: docker-cred
      containers:
        - name: pvt-bus
          image: umeshchandra2001/pvt_repo1:bus-v1
          ports:
            - containerPort: 80
