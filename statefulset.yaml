---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sfone
spec:
  replicas: 3
  selector:
    matchLabels:
      env: prd
  template:
    metadata:
      labels:
        env: prd
    spec:
      containers:
        - name: train-cont
          image: umeshchandra2001/ticket_booking:train-v1
          ports:
            - containerPort: 80

