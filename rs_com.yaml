---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: rsone
spec:
  replicas: 10
  selector:
    matchLabels:
      env: prd

  template:
    metadata:
      labels:
        env: prd

    spec:
      containers:
        - name: bus-cont
          image: umeshchandra2001/ticket_booking:train-v1
          ports:
            - containerPort: 80
