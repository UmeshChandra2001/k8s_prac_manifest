---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-one

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: deplyone
  minReplicas: 2
  maxReplicas: 6
  
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
